[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pycsrfshield"
version = "1.0.0"
description = "Zero-dependency CSRF protection for Python: signed tokens, origin checks, and WSGI/ASGI middleware"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "pycsrfshield contributors" }]
keywords = ["csrf", "security", "owasp", "wsgi", "asgi", "fastapi", "flask"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.urls]
Homepage = "https://github.com/draarivpatel-ui/pycsrfshield"
Repository = "https://github.com/draarivpatel-ui/pycsrfshield"
Issues = "https://github.com/draarivpatel-ui/pycsrfshield/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pycsrfshield = ["py.typed"]
